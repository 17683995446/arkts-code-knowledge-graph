name: Performance Benchmark

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to benchmark'
        required: false
        default: 'nest.js'

jobs:
  benchmark:
    name: Run Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clone test project
        run: |
          if [ "${{ github.event.inputs.project }}" == "vue.js" ]; then
            git clone --depth 1 https://github.com/vuejs/core.git ./test-project
          else
            git clone --depth 1 https://github.com/nestjs/nest.git ./test-project
          fi

      - name: Run comprehensive benchmark
        run: |
          npm run benchmark:full -- --project-path ./test-project

      - name: Run parse benchmark
        run: |
          npm run benchmark:parse -- --project-path ./test-project

      - name: Run query benchmark
        run: |
          npm run benchmark:query

      - name: Run memory benchmark
        run: |
          npm run benchmark:memory

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 90

      - name: Generate benchmark report
        run: |
          npm run benchmark:report

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 Performance Benchmark Results\n\nBenchmark completed successfully! Check the artifacts for detailed results.'
            })

  compare:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: [benchmark]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: current-results/

      - name: Download baseline results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-baseline
          path: baseline-results/
          continue-on-error: true

      - name: Compare results
        if: steps.download-baseline.outcome == 'success'
        run: |
          npm run benchmark:compare -- --current ./current-results --baseline ./baseline-results

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: comparison-results
          path: comparison-results/
          retention-days: 90

  store-baseline:
    name: Store Baseline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: baseline-results/

      - name: Upload as baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-baseline
          path: baseline-results/
          retention-days: 365
